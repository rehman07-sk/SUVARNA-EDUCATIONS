name: Build EduManage Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL reachable from the Android phone, ending in /api"
        required: true
        default: "http://192.168.0.9:5000/api"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build app assets for the selected backend
        working-directory: client
        env:
          VITE_API_URL: ${{ inputs.api_url }}
        run: |
          npm run build
          npx cap sync android

      - name: Assemble installable debug APK
        working-directory: client/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edumanage-android-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
